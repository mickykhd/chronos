</div>

<svg class="w-full h-full transform -rotate-90 drop-shadow-[0_4px_20px_rgba(255,183,130,0.15)]" viewbox="0 0 280 280">

<circle cx="140" cy="140" fill="transparent" r="122" stroke="#282A2C" stroke-width="8"></circle>
